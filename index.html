<title>かんたん売上チェック</title>
<style>
:root{--bg:#fff6ee;--card:#fff;--ink:#2a1d14;--sub:#7a6455;--line:#f1e1d3;--brand:#ea580c;--err:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#17110d;--card:#221913;--ink:#f3e9e1;--sub:#b8a596;--line:#3a2c22;--brand:#fb923c;--err:#fb923c}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.box{width:100%;max-width:360px;background:var(--card);border-radius:18px;padding:28px 24px;box-shadow:0 6px 24px rgba(124,45,18,.12);text-align:center}
.box img{width:84px;height:84px}h1{font-size:20px;margin:10px 0 4px}p{margin:0 0 18px;color:var(--sub);font-size:13px}
input[type=password]{width:100%;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:none;border-color:var(--brand)}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--sub);margin:12px 0 16px}
button{width:100%;font-size:16px;font-weight:700;padding:12px;border:0;border-radius:999px;background:var(--brand);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--err)}
</style></head><body>
<form class="box" id="f" autocomplete="off">
<img src="icon.png" alt="">
<h1>かんたん売上チェック</h1>
<p>社内用のページです。パスワードを入れてください。</p>
<input type="password" id="pw" placeholder="パスワード" autocomplete="current-password" required>
<label><input type="checkbox" id="keep"> この端末で覚えておく</label>
<button id="go">開く</button>
<div id="msg" role="alert"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY="kantan-key-"+P.s;
async function open_(bits){
  const ek=bits.slice(0,32), mk=bits.slice(32,64);
  const iv=b64(P.v), ct=b64(P.c), mac=b64(P.m);
  const hk=await crypto.subtle.importKey("raw",mk,{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  const both=new Uint8Array(iv.length+ct.length); both.set(iv); both.set(ct,iv.length);
  if(!await crypto.subtle.verify("HMAC",hk,mac,both)) return false;
  const ak=await crypto.subtle.importKey("raw",ek,{name:"AES-CBC"},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC",iv},ak,ct));
  document.open(); document.write(html); document.close(); return true;
}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(P.s),iterations:P.i,hash:"SHA-256"},base,512));
}
const msg=document.getElementById("msg"), go=document.getElementById("go");
(async()=>{ try{ const k=localStorage.getItem(KEY); if(k && await open_(b64(k))) return; }catch(e){} })();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); go.disabled=true; msg.textContent=""; go.textContent="確認中…";
  try{
    const bits=await derive(document.getElementById("pw").value.trim());
    if(document.getElementById("keep").checked){ try{ localStorage.setItem(KEY,btoa(String.fromCharCode(...bits))); }catch(_){} }
    if(!await open_(bits)){ msg.textContent="パスワードが違います。"; try{localStorage.removeItem(KEY)}catch(_){} }
  }catch(err){ msg.textContent="開けませんでした。ブラウザが古い可能性があります。"; }
  go.disabled=false; go.textContent="開く";
});
